<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
<meta name="description" content="Tự mix vòng charm PunPun Tinygold Charm: chọn dây, gắn charm, xem thành phẩm rồi gửi shop.">
<link rel="preconnect" href="https://docs.google.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>PunPun Charm Mix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: work area (bracelet tray + info popover + tool row) over a catalog with side categories; on desktop and phone-landscape the two sit side by side */
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --stage:#F3F2EF; --fg:#1C1B19; --muted:#6B6761; --line:#E7E5E1;
  --accent:#8C6A1F; --soft:#F1EFEB; --scrim:rgba(18,16,14,.45);
  --danger:#B3261E; --on-danger:#FFFFFF; --toast-act:#E6C670; --shine:rgba(255,255,255,.6);
  --on-accent:#FFFFFF; --chip:rgba(255,255,255,.94); --chip-line:#E2DFDA; --chip-shadow:0 6px 18px rgba(40,30,15,.10);
  --font:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease:cubic-bezier(.2,.7,.2,1); --fast:120ms; --med:200ms;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-in:cubic-bezier(.4,0,1,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131312; --surface:#1B1B19; --stage:#222120; --fg:#F2F1EE; --muted:#A39F98; --line:#34332F;
  --accent:#D8B868; --soft:#262523; --scrim:rgba(0,0,0,.62);
  --danger:#F28B82; --on-danger:#2B0B08; --toast-act:#6E5110; --shine:rgba(255,255,255,.07);
  --on-accent:#1B1A17; --chip:rgba(48,47,44,.94); --chip-line:#45433F; --chip-shadow:0 6px 18px rgba(0,0,0,.36); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131312; --surface:#1B1B19; --stage:#222120; --fg:#F2F1EE; --muted:#A39F98; --line:#34332F;
  --accent:#D8B868; --soft:#262523; --scrim:rgba(0,0,0,.62);
  --danger:#F28B82; --on-danger:#2B0B08; --toast-act:#6E5110; --shine:rgba(255,255,255,.07);
  --on-accent:#1B1A17; --chip:rgba(48,47,44,.94); --chip-line:#45433F; --chip-shadow:0 6px 18px rgba(0,0,0,.36); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
/* chặn phóng to khi chạm 2 lần trên điện thoại (vẫn cuộn và zoom 2 ngón được) */
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
*{touch-action:manipulation}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); font-size:14px; line-height:1.45; -webkit-tap-highlight-color:transparent; overscroll-behavior:none}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0; position:relative}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.vh{position:absolute!important; top:0; left:0; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap}

.shell{height:100%; display:flex; flex-direction:column; max-width:1200px; margin:0 auto;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
@supports (height:100dvh){ .shell{height:100dvh} }
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 16px 8px}
.brand{display:flex; align-items:baseline; gap:8px; min-width:0}
.brand b{font-size:19px; font-weight:700; letter-spacing:-.02em}
.brand span{font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.pill-btn{height:40px; padding:0 16px; border-radius:999px; border:1px solid var(--fg); font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; flex:none; transition:background-color var(--fast)}
.pill-btn::after{content:""; position:absolute; inset:-3px}
.pill-btn:active{background:var(--soft)}

/* work area */
.work{padding:0 16px; flex:none}
.stage{position:relative; background:var(--stage); border-radius:18px}
.canvas-wrap{position:relative; display:flex; justify-content:flex-start; min-width:0}
#stage{display:block; touch-action:none; user-select:none; -webkit-user-select:none; border-radius:18px}
.stage-btn{position:absolute; top:8px; z-index:2; width:36px; height:36px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:grid; place-items:center; color:var(--muted); transition:background-color var(--fast), color var(--fast), border-color var(--fast)}
.stage-btn::after{content:""; position:absolute; inset:-5px}
.stage-btn:active{background:var(--soft)}
.stage-btn[aria-expanded="true"], .stage-btn[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.info-btn{right:8px}
.num-btn{left:8px}
/* thông tin vòng: chỉ hiện khi bấm nút (i) ở góc phải trên */
.specs{position:absolute; top:50px; right:8px; z-index:2; margin:0; min-width:184px; padding:10px 12px; display:grid; gap:7px; border-radius:14px; background:var(--chip); border:1px solid var(--chip-line); box-shadow:var(--chip-shadow); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); transform-origin:top right}
.specs div{display:flex; justify-content:space-between; align-items:baseline; gap:16px}
.specs dt{font-size:12px; color:var(--muted)}
.specs dd{margin:0; font-weight:600; font-size:12.5px; font-variant-numeric:tabular-nums; white-space:nowrap}
.specs dd.big{font-size:13.5px}
.corner{position:absolute; top:8px; left:50%; transform:translateX(-50%); display:flex; align-items:center}
.seg{display:inline-flex; padding:2px; gap:2px; border-radius:999px; background:var(--surface); border:1px solid var(--line)}
.seg button{height:30px; padding:0 11px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--muted); display:inline-flex; align-items:center; gap:5px; transition:background-color var(--med) var(--ease), color var(--med) var(--ease)}
.seg button::after{content:""; position:absolute; inset:-8px 0}
.seg button[aria-checked="true"]{background:var(--fg); color:var(--bg)}

.sel-pill{position:absolute; left:50%; bottom:8px; transform:translateX(-50%); max-width:calc(100% - 16px); height:36px; display:flex; align-items:center; gap:8px; padding:0 16px; border-radius:999px; background:var(--chip); border:1px solid var(--chip-line); box-shadow:var(--chip-shadow); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); color:var(--fg); font-size:13px; white-space:nowrap; pointer-events:none}
.sel-pill .sc-name{font-weight:600; overflow:hidden; text-overflow:ellipsis; min-width:0}
.sel-pill .sc-v{flex:none; color:var(--muted)}
.sel-pill .sc-p{flex:none; font-weight:600; font-variant-numeric:tabular-nums; padding-left:9px; border-left:1px solid var(--chip-line)}
.pan-btn{position:absolute; top:0; width:36px; height:36px; margin-top:-18px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:grid; place-items:center; color:var(--fg); box-shadow:0 1px 4px rgba(0,0,0,.10); transition:opacity var(--med), background-color var(--fast)}
.pan-btn::after{content:""; position:absolute; inset:-5px}
.pan-btn.l{left:8px} .pan-btn.r{right:8px}
.pan-btn:disabled{opacity:0; visibility:hidden}
.pan-btn:active{background:var(--soft)}

.toolbar{display:flex; align-items:flex-start; gap:2px; padding:8px 0 10px}
.tools{display:flex; justify-content:center; gap:2px; flex:1; min-width:0}
.tool{display:flex; flex-direction:column; align-items:center; gap:4px; min-width:58px; flex:0 1 64px; font-size:12px; color:var(--fg); white-space:nowrap}
.tool .ic{width:44px; height:44px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:grid; place-items:center; transition:background-color var(--fast), transform var(--fast) var(--ease)}
.tool:active:not(:disabled) .ic{background:var(--soft); transform:scale(.94)}
.tool:disabled{opacity:.35}
.toolbar[data-mode="sel"] .tool[data-ctx="idle"], .toolbar[data-mode="idle"] .tool[data-ctx="sel"]{display:none}

@media (max-width:350px){
  .seg button{padding:0 8px; gap:4px}
  .tool{min-width:54px}
  .sel-pill{height:32px; bottom:6px; gap:6px; padding:0 12px}
}

/* catalog */
.catalog{flex:1; min-height:0; display:flex; flex-direction:column; background:var(--surface); border-top:1px solid var(--line); border-radius:20px 20px 0 0}
.ctabs{display:flex; gap:24px; padding:4px 16px 0; border-bottom:1px solid var(--line)}
.ctab{min-height:44px; padding:8px 0; font-weight:600; font-size:15px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; transition:color var(--fast)}
.ctab[aria-selected="true"]{color:var(--fg); border-color:var(--fg)}
.cbody{flex:1; min-height:0; display:flex}
.cside{flex:none; width:92px; overflow-y:auto; overscroll-behavior:contain; background:var(--soft); padding:6px 0 calc(12px + env(safe-area-inset-bottom,0px)); scrollbar-width:none}
.cside::-webkit-scrollbar{display:none}
.cside button{display:block; width:100%; min-height:44px; text-align:left; padding:11px 8px 11px 12px; font-size:13px; line-height:1.3; color:var(--muted); transition:background-color var(--fast), color var(--fast)}
.cside button[aria-current="true"]{background:var(--surface); color:var(--fg); font-weight:600}
.cside button[aria-current="true"]::before{content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:0 3px 3px 0; background:var(--fg)}
.cside .sk{height:14px; margin:15px 12px; border-radius:7px}
.cgrid-wrap{flex:1; min-width:0; overflow-y:auto; overscroll-behavior:contain; padding:12px 12px calc(24px + env(safe-area-inset-bottom,0px))}
.cgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px 8px}
.card{display:flex; flex-direction:column; align-items:center; gap:3px; padding:0 0 4px; border-radius:14px; text-align:center; min-width:0}
.card .ph{width:100%; aspect-ratio:1; border-radius:14px; background:var(--stage); display:grid; place-items:center; overflow:hidden; margin-bottom:5px; transition:transform var(--fast) var(--ease), box-shadow var(--fast)}
.card .ph img{width:84%; height:84%; object-fit:contain; display:block}
.card:active .ph{transform:scale(.96)}
@media (hover:hover){ .card:hover .ph{box-shadow:inset 0 0 0 1px var(--muted)} }
.card .nm{font-size:12.5px; font-weight:600; line-height:1.3; width:100%; padding:0 2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere}
.card .tag{font-size:12px; color:var(--muted); background:var(--soft); border-radius:6px; padding:1px 8px; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card .pr{font-size:12.5px; font-variant-numeric:tabular-nums; margin-top:auto; padding-top:1px}
.card .pr small{font-size:12px; font-weight:400; color:var(--muted); margin-left:1px}
.card .used{position:absolute; top:6px; right:6px; font-size:12px; font-weight:700; background:var(--fg); color:var(--bg); border-radius:999px; min-width:22px; height:22px; padding:0 6px; display:grid; place-items:center; line-height:1}
.card.on .ph{box-shadow:inset 0 0 0 2px var(--fg)}
.card.on .tag{background:var(--fg); color:var(--bg)}
.card.skel{pointer-events:none}
.card.skel .ph{background:var(--soft)}
.card.skel .l1,.card.skel .l2{height:11px; border-radius:6px; margin-top:4px}
.card.skel .l1{width:72%} .card.skel .l2{width:44%}
.note{font-size:12.5px; color:var(--muted); padding:16px 4px 0; margin:0}
.sk{background:var(--soft); position:relative; overflow:hidden}

/* sheets */
.overlay{position:fixed; inset:0; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center; z-index:50}
.sheet{background:var(--surface); width:100%; max-width:560px; border-radius:22px 22px 0 0; padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px)); max-height:90%; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:14px}
.sheet.tall{height:92%}
.sh-top{display:flex; flex-direction:column; gap:8px; touch-action:none; margin:0 -16px; padding:0 16px}
.grab{align-self:center; width:40px; height:5px; border-radius:3px; background:var(--line); flex:none}
.sh-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.sh-head h3{margin:6px 0 0; font-size:18px; font-weight:700; letter-spacing:-.01em; text-wrap:balance}
.code{font-size:12px; color:var(--muted); letter-spacing:.06em}
.x{width:40px; height:40px; border-radius:50%; background:var(--soft); display:grid; place-items:center; flex:none; transition:background-color var(--fast)}
.x::after{content:""; position:absolute; inset:-2px}
.x:active{background:var(--line)}
.lbl{font-size:12px; color:var(--muted)}
.lbl b{color:var(--fg); font-weight:600}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:inline-flex; align-items:center; gap:7px; height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--line); font-size:13.5px; font-weight:500; white-space:nowrap; transition:border-color var(--fast), box-shadow var(--fast), background-color var(--fast)}
.chip:active{background:var(--soft)}
.chip[aria-checked="true"]{border-color:var(--fg); box-shadow:inset 0 0 0 1px var(--fg); font-weight:700}
.sh-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; position:sticky; bottom:-18px; background:var(--surface); padding:10px 0 4px; margin-top:auto}
.btn{height:48px; padding:0 22px; border-radius:999px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--surface); transition:background-color var(--fast), opacity var(--fast)}
.btn:active{background:var(--soft)}
.btn.primary{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.btn.danger{background:var(--danger); color:var(--on-danger); border-color:var(--danger)}
.btn.primary:active,.btn.danger:active{opacity:.85}
.small{font-size:13px; color:var(--muted); margin:0; line-height:1.5}
.confirm-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px}

/* summary */
.sum-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.sum-actions .primary{grid-column:1 / -1}
.sum-box{border:1px solid var(--line); border-radius:14px; overflow:hidden}
.row{display:grid; grid-template-columns:26px 40px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 12px; border-top:1px solid var(--line); width:100%; text-align:left}
.row:first-child{border-top:0}
.row.nonum{grid-template-columns:40px minmax(0,1fr) auto}
button.row{transition:background-color var(--fast)}
button.row:active{background:var(--soft)}
.row img{width:40px; height:40px; object-fit:contain}
.row .t{min-width:0}
.row .t b{display:block; font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .t span{font-size:12px; color:var(--muted)}
.row .p{font-variant-numeric:tabular-nums; font-size:13px}
.num{width:24px; height:24px; border-radius:50%; background:var(--fg); color:var(--bg); font-size:12px; font-weight:700; display:grid; place-items:center}
.total{display:flex; justify-content:space-between; align-items:baseline; padding:4px 2px}
.total span{font-weight:600}
.total b{font-size:22px; font-variant-numeric:tabular-nums}
.sec-t{font-size:12px; color:var(--muted); margin:2px 2px -6px; display:flex; justify-content:space-between}
details.open-code summary{cursor:pointer; color:var(--muted); font-size:13.5px; min-height:44px; display:flex; align-items:center; gap:6px}
details.open-code summary::-webkit-details-marker{display:none}
details.open-code summary::before{content:""; width:7px; height:7px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(-45deg); transition:transform var(--fast); margin:0 4px 0 2px}
details.open-code[open] summary::before{transform:rotate(45deg)}
.field-l{display:block; font-size:12.5px; font-weight:600; margin:2px 2px 6px}
.code-form{display:flex; gap:8px}
.code-form input{flex:1; min-width:0; height:48px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--fg); padding:0 12px; font:inherit; font-size:16px}
.code-form input[aria-invalid="true"]{border-color:var(--danger); box-shadow:inset 0 0 0 1px var(--danger)}
.err{color:var(--danger); font-size:12.5px; margin:6px 2px 0; font-weight:500}
.img-out{width:100%; border-radius:12px; border:1px solid var(--line); display:block}
.img-skel{width:100%; height:min(56vh,440px); border-radius:12px}
textarea.copybox{width:100%; min-height:240px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--fg); padding:12px; font:16px/1.5 var(--mono)}

.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); --toast-off:calc(100% + 28px + env(safe-area-inset-bottom,0px));
  transform:translate3d(-50%,var(--toast-off),0); opacity:0; visibility:hidden; will-change:transform,opacity;
  transition:transform 240ms var(--ease-in), opacity 180ms linear 60ms, visibility 0s linear 240ms; display:flex; align-items:center; gap:2px; min-height:44px; width:max-content; max-width:calc(100% - 32px); background:var(--fg); color:var(--bg); padding:0 16px; border-radius:22px; font-size:13.5px; font-weight:500; z-index:80; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.18)}
/* toast trượt lên từ đáy (giảm tốc khi tới), rút xuống nhanh hơn (tăng tốc khi đi); đang chạy vẫn đổi hướng mượt */
.toast.show{transform:translate3d(-50%,0,0); opacity:1; visibility:visible; transition:transform 420ms var(--ease-out), opacity 200ms linear, visibility 0s}
.toast .msg{padding:11px 0}
.toast.has-act{padding-right:4px}
.toast button{pointer-events:auto; flex:none; height:36px; padding:0 12px; margin-left:6px; border-radius:18px; font-weight:700; color:var(--toast-act)}
.toast button::after{content:""; position:absolute; inset:-4px}
.toast button:active{background:rgba(128,128,128,.25)}

/* điện thoại xoay ngang: vòng bên trái, danh mục bên phải */
@media (orientation:landscape) and (max-height:520px){
  .shell{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); column-gap:16px;
    padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top{grid-column:1 / -1; padding:6px 0}
  .work{padding:0; grid-row:2; grid-column:1; align-self:start}
  .catalog{grid-row:2; grid-column:2; border:1px solid var(--line); border-bottom:0; border-radius:18px 18px 0 0; min-height:0}
  .toolbar{padding:6px 0 8px}
  .toast{bottom:auto; top:calc(8px + env(safe-area-inset-top,0px)); --toast-off:calc(-100% - 16px - env(safe-area-inset-top,0px))}
}
@media (min-width:900px) and (min-height:521px){
  .shell{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); column-gap:28px; padding:0 24px 24px}
  .top{grid-column:1 / -1; padding:18px 0 10px}
  .work{padding:0; align-self:start}
  .canvas-wrap{justify-content:center}
  .catalog{border:1px solid var(--line); border-radius:20px; min-height:0}
  .overlay{align-items:center}
  .sheet{border-radius:22px; padding:22px; max-height:88%}
  .sheet.tall{height:auto}
  .grab{display:none}
  .sh-top{touch-action:auto}
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
  .cside{width:112px}
}
@media (prefers-reduced-motion:no-preference){
  .overlay:not([hidden]) .sheet{animation:up .24s var(--ease)}
  @keyframes up{from{transform:translateY(28px); opacity:.5} to{transform:none; opacity:1}}
  .tools.swap{animation:swap var(--med) var(--ease)}
  @keyframes swap{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:none}}
  .cgrid.enter .card{animation:cardIn .26s var(--ease) both; animation-delay:calc(var(--i,0) * 22ms)}
  @keyframes cardIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .sel-pill:not([hidden]){animation:chipIn 260ms var(--ease-out)}
  .specs:not([hidden]){animation:popIn 200ms var(--ease-out)}
  @keyframes popIn{from{opacity:0; transform:translateY(-4px) scale(.96)} to{opacity:1; transform:none}}
  @keyframes chipIn{from{opacity:0; transform:translate(-50%,8px) scale(.96)} to{opacity:1; transform:translate(-50%,0)}}

function parseCSV(t){const rows=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}else if(ch==='"')q=true;else if(ch===','){row.push(f);f='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}else f+=ch;}if(f||row.length){row.push(f);rows.push(row);}return rows;}

const IMG=new Map();

function loadImg(src){
  let rec=IMG.get(src);if(rec)return rec;
  rec={el:null,ok:false,cors:false,failed:false,waiters:[]};IMG.set(src,rec);
  rec.p=new Promise(res=>{
    const fin=()=>{const w=rec.waiters;rec.waiters=[];w.forEach(f=>{try{f(rec);}catch(e){}});res(rec);};
    const a=new Image();a.crossOrigin='anonymous';a.decoding='async';
    a.onload=()=>{rec.el=a;rec.ok=true;rec.cors=true;fin();};
    a.onerror=()=>{const b=new Image();b.decoding='async';b.onload=()=>{rec.el=b;rec.ok=true;fin();};b.onerror=()=>{rec.failed=true;fin();};b.src=src;};
    a.src=src;

/* Dây ảnh thật: ảnh là một đoạn dây thẳng nằm ngang (nền trong suốt). App lặp đoạn đó thành cả sợi
   rồi cắt thành lát mỏng, đặt từng lát theo đường cong nên uốn được thành vòng tròn, dây ngang và lúc đang chuyển.

const TEX=new Map();
function texFor(src){
  if(!src)return null;

  if(!rec.cors)return null;

const strapTex=st=>st?texFor(st.img):null;

function analyzeTex(im){

  try{
    const k=Math.min(1,800/Math.max(W,1)),w=Math.max(1,Math.round(W*k)),h=Math.max(1,Math.round(H*k));
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);
    const d=x.getImageData(0,0,w,h).data,row=new Float32Array(h),col=new Float32Array(w);let r=0,g=0,b=0,n=0;
    for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){const i=(yy*w+xx)*4,a=d[i+3];if(a>40){row[yy]++;col[xx]++;}if(a>200){r+=d[i];g+=d[i+1];b+=d[i+2];n++;}}
    let a0=-1,a1=-1;for(let yy=0;yy<h;yy++)if(row[yy]>=w*.3){if(a0<0)a0=yy;a1=yy;}
    if(a0>=0){y0=a0/k;y1=(a1+1)/k;}
    let c0=-1,c1=-1;const bh=Math.max(1,a1-a0+1);for(let xx=0;xx<w;xx++)if(col[xx]>=bh*.4){if(c0<0)c0=xx;c1=xx;}
    if(c0>=0){x0=c0/k;x1=(c1+1)/k;}

  x.textAlign='right';x.fillStyle=MUTE;x.font='500 19px '+FONT;x.fillText(new Date().toLocaleDateString('vi-VN'),W-P,y+20);x.textAlign='left';
  y+=118;
  x.save();x.translate(P,y);rr(x,0,0,inner,inner,28);x.fillStyle='#F3F2EF';x.fill();x.clip();
  drawScene(x,inner,inner,{bg:null,k:1,m:0,reserve:0,nums:true,sel:null,numBg:INK,numFg:'#FFFFFF',empty:MUTE});x.restore();
  y+=inner+44;
  /* trải ngang cả sợi dây + thước cm để shop thấy đúng vị trí từng charm */
  x.fillStyle=MUTE;x.font='600 16px '+FONT;x.fillText(`TRẢI NGANG · DÂY ${state.size} CM`,P,y);
  y+=16;
  x.save();x.translate(P,y);rr(x,0,0,inner,bandH,24);x.fillStyle='#F3F2EF';x.fill();x.clip();
  const lay2=drawScene(x,inner,bandH,{bg:null,k:1,m:1,fit:'whole',reserve:0,lineY:lineYpx/bandH,nums:true,sel:null,numBg:INK,numFg:'#FFFFFF'});
  {const g2=lay2.g,rx0=g2.ax-(Lmm/2)*g2.s,ry=g2.ay+16.5*g2.s,rx1=rx0+Lmm*g2.s;
   x.strokeStyle=MUTE;x.lineWidth=1;x.beginPath();x.moveTo(rx0,ry);x.lineTo(rx1,ry);
   for(let mm=0;mm<=Lmm;mm+=10){const tx=rx0+mm*g2.s;x.moveTo(tx,ry);x.lineTo(tx,ry+(mm%50===0?9:5));}
   x.moveTo(rx1,ry);x.lineTo(rx1,ry+9);x.stroke();
   x.fillStyle=MUTE;x.font='500 13px '+FONT;x.textAlign='center';
   for(let cmv=0;cmv<=state.size;cmv+=5){if(cmv!==0&&state.size-cmv<2)continue;x.fillText(String(cmv),rx0+cmv*10*g2.s,ry+24);}
   x.fillText(state.size+' cm',rx1,ry+24);x.textAlign='left';}
  x.restore();
  y+=bandH+44;
  const st=strapE();
  x.fillStyle=MUTE;x.font='600 16px '+FONT;x.fillText('DÂY',P,y);
  await drawFit(x,strapThumb(st.code,80),P,y+14,64);
  x.fillStyle=INK;x.font='600 25px '+FONT;x.fillText(fitText(x,`${st.name}${st.vname?' – '+st.vname:''}`,inner-84-160),P+84,y+42);
  x.fillStyle=MUTE;x.font='400 19px '+FONT;x.fillText(`Dài ${STRAP_CM} cm · ${st.code}`,P+84,y+70);
  x.textAlign='right';x.fillStyle=INK;x.font='500 22px '+FONT;x.fillText(fmt(st.price),W-P,y+42);x.textAlign='left';
  y+=110;
  x.fillStyle=MUTE;x.font='600 16px '+FONT;x.fillText(`${state.items.some(it=>CE[it.code]&&CE[it.code].stop)?'CHARM & HẠT CHẶN':'CHARM'} · ${n} CÁI · THỨ TỰ TỪ TRÁI SANG PHẢI`,P,y);
  y+=22;
  const colW=cols===2?(inner-36)/2:inner;
  for(let i=0;i<n;i++){
    const it=state.items[i],e=CE[it.code];
    const col=cols===2&&i>=rows?1:0,r=col?i-rows:i,x0=P+col*(colW+36),y0=y+r*rowH;
    x.strokeStyle=LINE;x.lineWidth=1;x.beginPath();x.moveTo(x0,y0);x.lineTo(x0+colW,y0);x.stroke();
    x.beginPath();x.arc(x0+15,y0+rowH/2,15,0,Math.PI*2);x.fillStyle=INK;x.fill();
    x.fillStyle='#fff';x.font='700 15px '+FONT;x.textAlign='center';x.fillText(String(i+1),x0+15,y0+rowH/2+5.5);x.textAlign='left';
    await drawFit(x,charmThumb(it.code,80),x0+38,y0+8,60);
    const priceW=110;
    x.fillStyle=INK;x.font='600 21px '+FONT;x.fillText(fitText(x,e.name,colW-110-priceW),x0+108,y0+33);
    x.fillStyle=MUTE;x.font='400 17px '+FONT;x.fillText(fitText(x,`${e.vname?e.vname+' · ':''}${e.code}${e.stop?' · 1 hạt (½ cặp)':''}`,colW-110-priceW),x0+108,y0+58);
    x.textAlign='right';x.fillStyle=INK;x.font='500 19px '+FONT;x.fillText(fmt(e.price),x0+colW,y0+33);x.textAlign='left';
  }
  if(!n){x.fillStyle=MUTE;x.font='400 19px '+FONT;x.fillText('Chưa có charm nào.',P,y+40);}
  y+=rows*rowH+30;
  x.strokeStyle=INK;x.lineWidth=2;x.beginPath();x.moveTo(P,y);x.lineTo(W-P,y);x.stroke();
  x.fillStyle=INK;x.font='600 26px '+FONT;x.fillText('Tạm tính',P,y+56);
  x.textAlign='right';x.font='700 40px '+FONT;x.fillText(fmt(total()),W-P,y+60);x.textAlign='left';
  y+=100;
  x.fillStyle=MUTE;x.font='500 19px ui-monospace, Menlo, monospace';codeLines.forEach((l,i)=>x.fillText(l,P,y+i*28));
  y+=codeLines.length*28+18;
  x.fillStyle=INK;x.font='500 20px '+FONT;x.fillText('Gửi ảnh này cho PunPun qua chat Shopee / TikTok Shop để shop lên đơn.',P,y);
  return c;
}
let lastCanvas=null;
async function exportImage(){
  openSheet('image',{});
  try{
    const c=await buildImage();lastCanvas=c;let url;
    try{url=c.toDataURL('image/png');}catch(err){lastCanvas=null;if(sheetKind==='image'){sheetData={error:'Ảnh charm chưa cho phép xuất thành ảnh. Bạn chụp màn hình vòng và danh sách charm gửi shop giúp nhé.'};renderSheet();}return;}
    if(sheetKind==='image'){sheetData={url};renderSheet();}
  }catch(e){if(sheetKind==='image'){sheetData={error:'Chưa tạo được ảnh. Bạn thử lại hoặc chụp màn hình nhé.'};renderSheet();}}
}
let DL=null;
try{if(window.claude&&window.claude.use){window.claude.use('downloads').then(d=>{DL=d||null;if(sheetKind==='image')renderSheet();}).catch(()=>{});}}catch(e){}
async function download(){
  if(!lastCanvas)return;
  const blob=await new Promise(r=>lastCanvas.toBlob(r,'image/png'));
  const name='punpun-thiet-ke-vong.png';
  if(DL){
    try{await DL.save({filename:name,data:blob});toast('Đã lưu ảnh');}
    catch(e){if(e&&e.code==='declined')return;toast('Không tải được ở đây. Nhấn giữ ảnh để lưu nhé.');}
    return;
  }
  try{
    const file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Thiết kế vòng PunPun'});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}

/* ---------- toast (có nút Undo khi vừa xoá) ---------- */
let tt=null;
function toast(m,opt){
  opt=opt||{};
  const t=$('toast');
  t.innerHTML=`<span class="msg"></span>${opt.undo?'<button type="button" data-toast-undo>Undo</button>':''}`;
  t.querySelector('.msg').textContent=m;
  t.classList.toggle('has-act',!!opt.undo);
  t.dataset.h=opt.undo?String(hist.length):'';
  /* đang hiện thì chỉ đổi nội dung; đang ẩn thì đợi 1 khung hình để trượt lên từ vị trí dưới đáy */
  if(!t.classList.contains('show'))requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
  $('live').textContent=m+(opt.undo?'. Bấm Undo để lấy lại.':'');
  clearTimeout(tt);tt=setTimeout(hideToast,opt.ms||(opt.undo?5000:2600));
}
function hideToast(){clearTimeout(tt);const t=$('toast');t.classList.remove('show');t.dataset.h='';}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-pick]');if(!b)return;
  const ds=b.dataset;
  if('close' in ds)return closeSheet();
  if('deselect' in ds){sel=null;refreshSel();return;}
  if('toastUndo' in ds){const t=$('toast');if(t.dataset.h!==''&&+t.dataset.h===hist.length)tool('undo');hideToast();return;}
  if(ds.pan){if(!LAY)return;const g=LAY.g,step=(CW*.6)/g.sL;panTo(Math.max(-g.panMax,Math.min(g.panMax,VIEW.pan+(+ds.pan)*step)),340);return;}
  if(ds.view)return setView(ds.view);
  if(b.id==='infoBtn')return toggleInfo();
  if(ds.tool)return tool(ds.tool);
  if(ds.ctab){if(ds.ctab!==ctab){ctab=ds.ctab;renderCatalog(true);$('gridWrap').scrollTop=0;}return;}
  if(ds.cat){const c=ds.cat==='all'?'all':(CAT.cats[+ds.cat]||'all');if(c!==catId){catId=c;renderCatalog(true);$('gridWrap').scrollTop=0;}return;}
  if(ds.scat){const c=ds.scat==='all'?'all':(CAT.stopCats[+ds.scat]||'all');if(c!==stopCatId){stopCatId=c;renderCatalog(true);$('gridWrap').scrollTop=0;}return;}
  if(ds.charm){
    const en=CE[ds.charm];if(!en)return;const i=selIndex(),n={uid:newUid(),code:en.code};
    commit(()=>{if(i>=0)state.items.splice(i+1,0,n);else state.items.push(n);sel=null;});
    $('live').textContent=`Đã gắn ${en.name}${en.vname?' '+en.vname:''}, vị trí ${state.items.indexOf(n)+1}`;return;
  }
  if(ds.strap){
    const en=SE[ds.strap];if(!en||state.strap===en.code)return;
    commit(()=>{state.strap=en.code;});$('live').textContent=`Đã đổi sang ${en.name}${en.vname?' '+en.vname:''}`;return;
  }
  const a=ds.act;if(!a)return;
  if(a==='image'){if(!CAT.straps.length){toast('Đang tải danh mục, bạn đợi chút nhé');return;}return exportImage();}
  if(a==='download')return download();
  if(a==='link')return copyLink();
  if(a==='clearYes'){const n=state.items.length;closeSheet();commit(()=>{state.items=[];sel=null;});toast(`Đã xoá ${n} charm`,{undo:true});return;}
});
/* nút (i): bật / tắt bảng nhỏ Số charm · Đã dùng · Tạm tính; bấm ra ngoài hoặc Esc là đóng */
function toggleInfo(open){
  const sp=$('specs'),btn=$('infoBtn');open=open==null?sp.hidden:open;
  sp.hidden=!open;btn.setAttribute('aria-expanded',String(open));
}
document.addEventListener('click',e=>{if(!$('specs').hidden&&e.target.closest&&!e.target.closest('#specs,#infoBtn'))toggleInfo(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('specs').hidden&&!sheetKind){toggleInfo(false);$('infoBtn').focus();}});
/* bấm bất kỳ đâu ngoài charm trên vòng (trừ các nút thao tác charm đang chọn) là bỏ chọn, hàng công cụ về Undo / Reset / Copy link */
document.addEventListener('click',e=>{
  if(sel===null||!e.target||!e.target.closest)return;
  if(e.target===cv||e.target.closest('.tool[data-ctx="sel"],#numBtn,#infoBtn,#specs,#overlay,#toast'))return;
  sel=null;refreshSel();
});
$('numBtn').addEventListener('click',()=>{showNums=!showNums;$('numBtn').setAttribute('aria-pressed',String(showNums));renderStage();});
/* phím mũi tên cho nhóm Tròn/Ngang và tab Charm/Dây */
$('viewSeg').addEventListener('keydown',e=>{if(!/^Arrow/.test(e.key))return;const mode=VIEW.target===1?'circle':'line';setView(mode);document.querySelector(`[data-view="${mode}"]`).focus();e.preventDefault();});
$('ctabs').addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const T=['charm','stop','strap'],i=T.indexOf(ctab);ctab=T[(i+(e.key==='ArrowRight'?1:T.length-1))%T.length];renderCatalog(true);$('gridWrap').scrollTop=0;document.querySelector(`[data-ctab="${ctab}"]`).focus();e.preventDefault();});
new ResizeObserver(()=>sizeStage()).observe($('canvasWrap'));
addEventListener('resize',sizeStage);
const themeChanged=()=>{TOK=null;renderStage();};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeChanged);}catch(e){}
new MutationObserver(themeChanged).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
addEventListener('hashchange',()=>{if(CAT.loading)return;const s=decode(location.hash.slice(1));if(s){commit(()=>{state={strap:s.strap,size:s.size,items:s.items};sel=null;});toast('Đã mở thiết kế được chia sẻ');}});

/* ---------- boot ---------- */
function initState(announce){
  const raw=location.hash&&location.hash.length>1?location.hash.slice(1):'';
  const fromHash=raw?decode(raw):null;
  const s=fromHash||loadDraft();
  state=s?{strap:s.strap,size:s.size,items:s.items}:defaultState();
  fitState();sel=null;
  if(announce&&fromHash)toast(fromHash.missing?`Đã mở thiết kế, ${fromHash.missing} charm không còn bán nên đã bỏ ra`:'Đã mở thiết kế được chia sẻ');
}
(async function boot(){
  let cached=null;
  if(STANDALONE){try{cached=JSON.parse(localStorage.getItem('punpun-sheet-v1')||'null');}catch(e){}}
  if(cached&&cached.cr)applyTables(cached.cr,cached.sr||[],cached.hr||[]);
  else if(STANDALONE){setCatalog([],[],'demo');CAT.loading=true;}
  else{const d=demoCatalog();setCatalog(d.charms,d.straps,'demo');}
  if(!CAT.loading)initState(true);else state={strap:'',size:STRAP_CM,items:[]};
  sizeStage();renderCatalog();changed();
  try{if(localStorage.getItem('punpun-view')==='line')setView('line',true);}catch(e){}
  if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('700 20px "Be Vietnam Pro"'),document.fonts.load('600 20px "Be Vietnam Pro"')]).then(()=>{thumbCache.clear();renderCatalog();renderStage();}).catch(()=>{});}
  if(!STANDALONE)return;
  const wasLoading=CAT.loading;
  try{
    const {cr,sr,hr}=await loadSheet();
    try{localStorage.setItem('punpun-sheet-v1',JSON.stringify({cr,sr,hr}));}catch(e){}
    const keep=wasLoading?null:{strap:state.strap,size:state.size,items:state.items};
    thumbCache.clear();applyTables(cr,sr,hr);
    if(keep){state=keep;fitState();}else initState(true);
  }catch(err){
    if(wasLoading){const d=demoCatalog();setCatalog(d.charms,d.straps,'demo');initState(true);}
    console.warn('Không tải được Google Sheet',err);
  }
  sizeStage();renderCatalog();changed();
})();
})();
