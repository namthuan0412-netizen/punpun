<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAFAF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
<meta name="description" content="Tự mix vòng charm PunPun Tinygold Charm: chọn dây, gắn charm, xem thành phẩm rồi gửi shop.">
<link rel="preconnect" href="https://docs.google.com">
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<style>body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>PunPun Charm Mix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: work area (bracelet tray + info popover + tool row) over a catalog with side categories; on desktop and phone-landscape the two sit side by side */
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --stage:#F3F2EF; --fg:#1C1B19; --muted:#6B6761; --line:#E7E5E1;
  --accent:#8C6A1F; --soft:#F1EFEB; --scrim:rgba(18,16,14,.45);
  --danger:#B3261E; --on-danger:#FFFFFF; --toast-act:#E6C670; --shine:rgba(255,255,255,.6);
  --hl:#FFE066; --on-hl:#1C1B19;
  --on-accent:#FFFFFF; --chip:rgba(255,255,255,.94); --chip-line:#E2DFDA; --chip-shadow:0 6px 18px rgba(40,30,15,.10);
  --font:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease:cubic-bezier(.2,.7,.2,1); --fast:120ms; --med:200ms;
  --ease-out:cubic-bezier(.22,1,.36,1); --ease-in:cubic-bezier(.4,0,1,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131312; --surface:#1B1B19; --stage:#222120; --fg:#F2F1EE; --muted:#A39F98; --line:#34332F;
  --accent:#D8B868; --soft:#262523; --scrim:rgba(0,0,0,.62);
  --danger:#F28B82; --on-danger:#2B0B08; --toast-act:#6E5110; --shine:rgba(255,255,255,.07);
  --hl:#F5D451; --on-hl:#1B1A17;
  --on-accent:#1B1A17; --chip:rgba(48,47,44,.94); --chip-line:#45433F; --chip-shadow:0 6px 18px rgba(0,0,0,.36); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131312; --surface:#1B1B19; --stage:#222120; --fg:#F2F1EE; --muted:#A39F98; --line:#34332F;
  --accent:#D8B868; --soft:#262523; --scrim:rgba(0,0,0,.62);
  --danger:#F28B82; --on-danger:#2B0B08; --toast-act:#6E5110; --shine:rgba(255,255,255,.07);
  --hl:#F5D451; --on-hl:#1B1A17;
  --on-accent:#1B1A17; --chip:rgba(48,47,44,.94); --chip-line:#45433F; --chip-shadow:0 6px 18px rgba(0,0,0,.36); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
/* khoá cuộn dọc của cả trang: chỉ danh mục (lưới charm, cột nhóm) và bảng mới cuộn được */
html,body{height:100%; overflow:hidden; overscroll-behavior:none}
/* chặn phóng to khi chạm 2 lần trên điện thoại (vẫn cuộn và zoom 2 ngón được) */
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
*{touch-action:manipulation}
body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); font-size:14px; line-height:1.45; -webkit-tap-highlight-color:transparent; overscroll-behavior:none}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0; position:relative}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.vh{position:absolute!important; top:0; left:0; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap}

.shell{height:100%; display:flex; flex-direction:column; max-width:1200px; margin:0 auto;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
@supports (height:100dvh){ .shell{height:100dvh} }
/* điện thoại dọc: lúc gõ tìm kiếm, đẩy header + khung vòng lên khỏi màn hình để ô nhập không bị thanh địa chỉ/bàn phím che.
   Bố cục chỉ đổi MỘT lần (header + khung vòng nằm trên mép màn hình, danh mục cao hết màn hình); phần chạy là transform
   của 3 khối (GPU lo) nên không phải tính lại bố cục mỗi khung hình như khi chạy margin-top. */
.shell{overflow:hidden; --lift-ms:700ms; --lift-ease:cubic-bezier(.4,0,.2,1)}
.shell.lifted > .top{margin-top:calc(-1 * var(--lift,0px))}
.shell.lifted > .top,.shell.lifted > .work,.shell.lifted > .catalog{transform:translate3d(0,var(--ly,0px),0)}
.shell.lift-anim > .top,.shell.lift-anim > .work,.shell.lift-anim > .catalog{transition:transform var(--lift-ms) var(--lift-ease); will-change:transform}
.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:8px 16px 8px}
.brand{display:flex; align-items:baseline; gap:8px; min-width:0}
.brand b{font-size:19px; font-weight:700; letter-spacing:-.02em}
.pill-btn{height:40px; padding:0 16px; border-radius:999px; border:1px solid var(--fg); font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; flex:none; transition:background-color var(--fast)}
.pill-btn::after{content:""; position:absolute; inset:-3px}
.pill-btn:active{background:var(--soft)}

/* work area */
.work{padding:0 16px; flex:none}
.stage{position:relative; background:var(--stage); border-radius:18px}
.canvas-wrap{position:relative; display:flex; justify-content:flex-start; min-width:0}
#stage{display:block; touch-action:none; user-select:none; -webkit-user-select:none; border-radius:18px}
.stage-btn{position:absolute; top:8px; z-index:2; width:36px; height:36px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:grid; place-items:center; color:var(--muted); transition:background-color var(--fast), color var(--fast), border-color var(--fast)}
.stage-btn::after{content:""; position:absolute; inset:-5px}
.stage-btn:active{background:var(--soft)}
.stage-btn[aria-expanded="true"], .stage-btn[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.info-btn{right:8px}
.num-btn{left:8px}
/* thông tin vòng: chỉ hiện khi bấm nút (i) ở góc phải trên */
.specs{position:absolute; top:50px; right:8px; z-index:2; margin:0; min-width:184px; padding:10px 12px; display:grid; gap:7px; border-radius:14px; background:var(--chip); border:1px solid var(--chip-line); box-shadow:var(--chip-shadow); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); transform-origin:top right}
.specs div{display:flex; justify-content:space-between; align-items:baseline; gap:16px}
.specs dt{font-size:12px; color:var(--muted)}
.specs dd{margin:0; font-weight:600; font-size:12.5px; font-variant-numeric:tabular-nums; white-space:nowrap}
.specs dd.big{font-size:13.5px}
.corner{position:absolute; top:8px; left:50%; transform:translateX(-50%); display:flex; align-items:center}
.seg{position:relative; display:inline-flex; padding:2px; gap:2px; border-radius:999px; background:var(--surface); border:1px solid var(--line)}
/* cục nền đậm của Tròn/Ngang: trượt qua lại giữa 2 nút (JS đặt --seg-x / --seg-w theo nút đang chọn) */
.seg::before{content:""; position:absolute; top:2px; left:0; height:30px; width:var(--seg-w,0px); border-radius:999px; background:var(--fg); transform:translate3d(var(--seg-x,0px),0,0); pointer-events:none}
.seg.ready::before{transition:transform 600ms cubic-bezier(.3,.7,.2,1), width 600ms cubic-bezier(.3,.7,.2,1)}
.seg button{z-index:1; height:30px; padding:0 11px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--muted); display:inline-flex; align-items:center; gap:5px; transition:color 600ms var(--ease)}
.seg button::after{content:""; position:absolute; inset:-8px 0}
.seg button[aria-checked="true"]{color:var(--bg)}
/* vòng kiềng (kim loại cứng) chỉ xem Tròn: ẩn nút Tròn/Ngang nhưng giữ chỗ để vòng không nhảy (13/10) */
.seg{transition:opacity 260ms var(--ease), visibility 0s}
.corner.only-ring .seg{opacity:0; visibility:hidden; pointer-events:none; transition:opacity 200ms var(--ease), visibility 0s linear 200ms}
.seg:not(.ready) button[aria-checked="true"]{background:var(--fg)}

/* viên thông tin charm nằm sát đáy khung vòng: bo 2 góc trên 16px, 2 góc dưới vuông, không viền dưới, không bóng đổ */
.sel-pill{position:absolute; left:50%; bottom:0; transform:translateX(-50%); transform-origin:50% 100%; max-width:calc(100% - 16px); height:30px; display:flex; align-items:center; gap:6px; padding:0 12px; border-radius:16px 16px 0 0; background:var(--chip); border:1px solid var(--chip-line); border-bottom:0; -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); color:var(--fg); font-size:11px; white-space:nowrap; pointer-events:none}
/* khung cắt ở đáy khung vòng: viên trượt lên từ mép đáy (phần chưa lên bị cắt), biến mất thì mờ nhoè tan đi */
.sel-clip{position:absolute; left:0; right:0; bottom:0; height:56px; overflow:hidden; pointer-events:none; border-radius:0 0 18px 18px}
.sel-pill .sc-name{font-weight:600; overflow:hidden; text-overflow:ellipsis; min-width:0}
.sel-pill .sc-v{flex:none; color:var(--muted)}
.sel-pill .sc-p{flex:none; font-weight:600; font-variant-numeric:tabular-nums; padding-left:7px; border-left:1px solid var(--chip-line)}
.pan-btn{position:absolute; top:0; width:36px; height:36px; margin-top:-18px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:grid; place-items:center; color:var(--fg); box-shadow:0 1px 4px rgba(0,0,0,.10); transition:opacity var(--med), background-color var(--fast)}
.pan-btn::after{content:""; position:absolute; inset:-5px}
.pan-btn.l{left:8px} .pan-btn.r{right:8px}
.pan-btn:disabled{opacity:0; visibility:hidden}
.pan-btn:active{background:var(--soft)}

.toolbar{display:flex; align-items:flex-start; gap:2px; padding:8px 0 10px}
.tools{display:flex; justify-content:center; gap:2px; flex:1; min-width:0}
/* hàng công cụ 4 nút (13/10 thêm Redo): mỗi ô (.slot) chứa nút lúc chưa chọn + nút lúc đang chọn chồng lên nhau, đổi qua lại bằng mờ + phóng.
   Chưa chọn: Undo, Redo, Reset, Copy link; đang chọn: Qua trái, Qua phải, Nhân đôi, Xoá — 2 chế độ cùng 4 ô nên nút không dời chỗ */
.slot{display:grid; justify-items:center; flex:0 1 64px; min-width:58px; transition:flex-basis 480ms cubic-bezier(.3,.7,.2,1), min-width 480ms cubic-bezier(.3,.7,.2,1), margin 480ms cubic-bezier(.3,.7,.2,1)}
.tool{grid-area:1 / 1; width:100%; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px; color:var(--fg); white-space:nowrap;
  transition:opacity 300ms var(--ease) 120ms, transform 420ms var(--ease-out) 120ms, visibility 0s}
.slot.s4 .tool{width:64px}
.tool .ic{width:44px; height:44px; border-radius:50%; background:var(--surface); border:1px solid var(--line); display:grid; place-items:center; transition:background-color var(--fast), transform var(--fast) var(--ease)}
.tool:active:not(:disabled) .ic{background:var(--soft); transform:scale(.94)}
.tool:disabled{opacity:.35}
.toolbar[data-mode="sel"] .tool[data-ctx="idle"], .toolbar[data-mode="idle"] .tool[data-ctx="sel"]{opacity:0; transform:scale(.7); visibility:hidden; pointer-events:none;
  transition:opacity 180ms var(--ease-in), transform 220ms var(--ease-in), visibility 0s linear 220ms}

@media (max-width:350px){
  .seg button{padding:0 8px; gap:4px}
  .slot{min-width:54px}
  .sel-pill{height:28px; gap:5px; padding:0 10px}
}

/* catalog */
.catalog{flex:1; min-height:0; display:flex; flex-direction:column; background:var(--surface); border-top:1px solid var(--line); border-radius:20px 20px 0 0; overflow:hidden; overflow:clip}
/* hàng tab + nút tìm kiếm (tab bên trái, kính lúp bên phải).
   Mở tìm kiếm: (điện thoại dọc) header + khung vòng đẩy lên trước; rồi tab trượt hẳn qua trái ra khỏi khung, CÙNG LÚC ô nhập
   trượt ra từ sau nút kính lúp sang trái tới đủ chiều dài — cùng thời lượng, cùng nhịp nên tab vừa đi hết là ô nhập vừa đủ dài.
   Kính lúp biến thành X. Chỉ chạy transform (GPU) nên vẫn mượt trên iPhone lúc bàn phím đang bật lên. Đóng thì chạy ngược lại. */
.cbar{position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:8px; padding:1px 6px 0 16px; border-bottom:1px solid var(--line); --s-dur:380ms; --s-ease:cubic-bezier(.45,0,.2,1); --s-delay:0ms}
.ctabs{position:relative; display:flex; gap:24px; min-width:0; transition:transform var(--s-dur) var(--s-ease)}
/* thanh gạch dưới tab đang chọn (12/10, shop yêu cầu): MỘT thanh chung trượt qua lại giữa các tab thay cho viền dưới của từng tab.
   JS (syncTabBar) đặt --tab-x / --tab-k theo tab đang chọn; chỉ chạy transform (GPU) nên vẫn mượt lúc lưới danh mục đang vẽ lại.
   Cùng nhịp với nút Tròn/Ngang: 600ms cubic-bezier(.3,.7,.2,1). Gốc rộng 100px, scaleX = bề ngang tab / 100 (thanh vuông, không bo nên co giãn không méo) */
.ctabs::after{content:""; position:absolute; left:0; bottom:-1px; width:100px; height:2px; background:var(--fg); transform-origin:0 50%; transform:translate3d(var(--tab-x,0px),0,0) scaleX(var(--tab-k,0)); pointer-events:none}
.ctabs.ready::after{transition:transform 600ms cubic-bezier(.3,.7,.2,1)}
.ctabs.tb-now::after{transition:none}
.ctabs:not(.ready)::after{opacity:0}
.cbar.searching .ctabs{transform:translate3d(var(--tabs-out,-120%),0,0); pointer-events:none; transition:transform var(--s-dur) var(--s-ease) var(--s-delay)}
/* ẩn hẳn (cho trình đọc màn hình / phím Tab) khi đã trượt ra hết; ô nhập lúc đóng cũng ẩn hẳn khi đã lùi xong — gắn bằng JS, không dùng transition visibility */
.cbar.s-gone .ctabs{visibility:hidden}
.sbtn{flex:none; align-self:center; width:40px; height:40px; margin-bottom:1px; border-radius:50%; display:grid; place-items:center; color:var(--fg); background:var(--surface); z-index:1; transition:background-color var(--fast)}
.sbtn::after{content:""; position:absolute; inset:-2px}
.sbtn:active{background:var(--soft)}
.sbtn svg{overflow:visible}
.sbtn .s-ring{stroke-dashoffset:0; opacity:1; transition:stroke-dashoffset 300ms var(--ease-out), opacity 0s}
.sbtn .s-a{stroke-dashoffset:-11.2px; transform:translate(1.5px,1.5px); transition:stroke-dashoffset 300ms var(--ease-out), transform 300ms var(--ease-out)}
.sbtn .s-b{stroke-dashoffset:17px; opacity:0; transition:stroke-dashoffset 220ms var(--ease-in), opacity 0s 220ms}
.cbar.searching .sbtn .s-ring{stroke-dashoffset:37.7px; opacity:0; transition:stroke-dashoffset 280ms var(--ease-in), opacity 0s 280ms}
.cbar.searching .sbtn .s-a{stroke-dashoffset:0; transform:none}
.cbar.searching .sbtn .s-b{stroke-dashoffset:0; opacity:1; transition:stroke-dashoffset 260ms var(--ease-out) 90ms, opacity 0s 90ms}
/* ô nhập: khung .csearch cắt ở giữa nút kính lúp; viên .cfield lúc đóng lùi sang phải, nấp sau nút (nút có nền đặc, tâm trùng tâm đầu tròn của viên) */
/* hàng tab đệm trên 1px (12/10, bớt 3px): ô nhập cách viền trên và đường kẻ dưới đều 3px, tâm trùng tâm nút X */
.csearch{position:absolute; left:12px; right:26px; top:3px; height:38px; overflow:hidden; overflow:clip; visibility:hidden; pointer-events:none}
.cbar.searching .csearch{visibility:visible; pointer-events:auto}
.cbar.s-closing .csearch{visibility:visible}
.cfield{position:absolute; top:0; bottom:0; left:0; right:26px; border-radius:19px; background:var(--soft); overflow:hidden; transform:translate3d(calc(100% + 7px),0,0); transition:transform var(--s-dur) var(--s-ease), box-shadow 160ms linear}
.cbar.searching .cfield{transform:translate3d(0,0,0); transition:transform var(--s-dur) var(--s-ease) var(--s-delay), box-shadow 160ms linear}
/* lúc mở: focus khi mọi thứ đã ở trạng thái cuối (iPhone đặt con trỏ đúng chỗ, không tự đẩy trang), rồi mới quay về hình lúc đầu và chạy */
.cbar.s-from .ctabs{transform:translate3d(0,0,0)}
.cbar.s-from .cfield{transform:translate3d(calc(100% + 7px),0,0)}
.cbar.s-instant .ctabs,.cbar.s-instant .cfield{transition:none}
/* nút mở rộng / thu gọn danh mục (chỉ điện thoại dọc: JS bật .has-x), nằm bên phải nút tìm kiếm.
   Lúc tìm kiếm: nút này trượt ra mép phải + mờ dần; nút tìm kiếm (X) và khung ô nhập dời sang phải đúng một chỗ nút (--xd),
   nên ô nhập vẫn dài tới mép phải như cũ và vẫn trồi ra từ sau nút. Cùng nhịp với tab / ô nhập (--s-dur, --s-ease, --s-delay). */
.xbtn{flex:none; align-self:center; width:40px; height:40px; margin:0 0 1px -4px; border-radius:50%; display:none; place-items:center; color:var(--fg); background:var(--surface); z-index:1; transition:background-color var(--fast), transform var(--s-dur) var(--s-ease), opacity var(--s-dur) var(--s-ease)}
.cbar.has-x{--xd:44px}
.cbar.has-x .xbtn{display:grid}
.xbtn::after{content:""; position:absolute; inset:-2px}
.xbtn:active{background:var(--soft)}
/* mũi tên lên = mở rộng; đang mở rộng thì xoay xuống, cùng nhịp với lúc danh mục đẩy lên / hạ xuống */
.xbtn svg{transition:transform var(--lift-ms,700ms) var(--lift-ease,ease)}
.xbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.cbar.has-x .sbtn{margin-left:auto; transition:background-color var(--fast), transform var(--s-dur) var(--s-ease)}
.cbar.has-x .csearch{transform:translate3d(calc(-1 * var(--xd)),0,0); transition:transform var(--s-dur) var(--s-ease)}
.cbar.has-x.searching .sbtn{transform:translate3d(var(--xd),0,0); transition-delay:0s, var(--s-delay)}
.cbar.has-x.searching .csearch{transform:translate3d(0,0,0); transition-delay:var(--s-delay)}
.cbar.has-x.searching .xbtn{transform:translate3d(var(--xd),0,0); opacity:0; pointer-events:none; transition-delay:0s, var(--s-delay), var(--s-delay)}
.cbar.s-gone .xbtn{visibility:hidden}
.cbar.has-x.s-from .sbtn,.cbar.has-x.s-from .xbtn{transform:none; opacity:1}
.cbar.has-x.s-from .csearch{transform:translate3d(calc(-1 * var(--xd)),0,0)}
.cbar.s-instant .sbtn,.cbar.s-instant .xbtn,.cbar.s-instant .csearch{transition:none}
/* con trỏ của iPhone không chạy theo hiệu ứng: ẩn con trỏ trong lúc ô nhập đang di chuyển */
.cbar.moving .csearch input{caret-color:transparent}
/* chữ trong ô tìm nhìn như 14px nhưng vẫn là 16px thật (iPhone tự phóng to trang khi ô nhập dưới 16px) */
.csearch input{width:calc(100% / .875); height:calc(100% / .875); transform:scale(.875); transform-origin:0 0; border:0; background:transparent; color:var(--fg); font:inherit; font-size:16px; padding:0 16px; outline:none; -webkit-appearance:none; appearance:none; border-radius:22px}
.csearch input::placeholder{color:var(--muted); opacity:1}
.csearch input::-webkit-search-cancel-button,.csearch input::-webkit-search-decoration{-webkit-appearance:none; appearance:none; display:none}
.cfield:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cbar.moving .cfield{box-shadow:none}
/* đang đợi 0,5 giây sau khi ngưng gõ: vạch vàng mảnh chạy dưới ô nhập */
.qbar{position:absolute; left:14px; right:14px; bottom:3px; height:2px; border-radius:1px; background:var(--accent); transform:scaleX(0); transform-origin:left; opacity:0; pointer-events:none}
.cbar.typing .qbar{opacity:.85; animation:qfill .5s linear forwards}
@keyframes qfill{from{transform:scaleX(0)} to{transform:scaleX(1)}}
.grid-head{font-size:13px; color:var(--muted); padding:0 2px 10px}
.grid-head b{color:var(--fg); font-weight:700}
.gsec{grid-column:1 / -1; margin:6px 0 -2px; font-size:12px; font-weight:600; letter-spacing:.02em; color:var(--muted)}
.gsec:first-child{margin-top:0}
mark{background:var(--hl); color:var(--on-hl); border-radius:3px; padding:0 1px; -webkit-box-decoration-break:clone; box-decoration-break:clone}
.card .cd{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
/* chữ tab nhỏ lại (12/10: 15px → 13px) nhưng vùng bấm giữ nguyên: cao 44px, nới ngang ra hết nửa khoảng cách giữa 2 tab */
.ctab{min-height:44px; padding:8px 0; font-weight:600; font-size:13px; white-space:nowrap; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; transition:color 400ms var(--ease)}
.ctab::after{content:""; position:absolute; top:0; bottom:0; left:-12px; right:-12px}
/* 4 tab Charm · Hạt chặn · Dây · Kiềng (13/10): máy rất hẹp (< 360px) thu khoảng cách giữa các tab cho vừa hàng */
@media (max-width:359px){.ctabs{gap:16px}.ctab::after{left:-8px; right:-8px}}
.ctab[aria-selected="true"]{color:var(--fg)}
/* chưa đặt được vị trí thanh trượt (lần vẽ đầu) thì tab đang chọn tự có viền dưới như cũ */
.ctabs:not(.ready) .ctab[aria-selected="true"]{border-color:var(--fg)}
.cbody{flex:1; min-height:0; display:flex}
.cside{position:relative; isolation:isolate; flex:none; width:92px; overflow-y:auto; overscroll-behavior:contain; background:var(--soft); padding:6px 0 calc(12px + env(safe-area-inset-bottom,0px)); scrollbar-width:none}
.cside::-webkit-scrollbar{display:none}
.cside button{z-index:1; display:block; width:100%; min-height:44px; text-align:left; padding:11px 8px 11px 12px; font-size:13px; line-height:1.3; color:var(--muted); transition:background-color var(--fast), color 400ms var(--ease)}
.cside button[aria-current="true"]{background:var(--surface); color:var(--fg); font-weight:600}
.cside button[aria-current="true"]::before{content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:0 3px 3px 0; background:var(--fg)}
/* cột nhóm (12/10, shop yêu cầu): nền sáng + vạch trắng của nhóm đang chọn là 2 lớp chung (.cside::before / ::after) trượt lên / xuống
   giữa các nhóm, cùng nhịp thanh tab và nút Tròn/Ngang (600ms cubic-bezier(.3,.7,.2,1)). JS (syncSideBar) đặt vị trí + chiều cao theo nút đang chọn
   (nhóm 2 dòng như "Butter Bear" cao hơn thì lớp nền / vạch cũng giãn theo). Lần vẽ đầu (chưa .ready) hoặc không có nhóm đang chọn thì nút tự vẽ như cũ */
/* thứ tự lớp ghi rõ bằng z-index (nền 0 < chữ 1 < vạch 2), như nút Tròn/Ngang: iPhone (Safari) lúc danh mục đang đẩy lên / hạ xuống (will-change:transform)
   từng vẽ lớp nền đè lên chữ nhóm đang chọn → chữ mất ~0,7 giây (12/10). Dùng translateY 2D để lớp nền không bị tách thành lớp GPU riêng khi đứng yên */
.cside::before{content:""; position:absolute; z-index:0; left:0; right:0; top:0; height:var(--cs-h,0px); transform:translateY(var(--cs-y,0px)); background:var(--surface); pointer-events:none}
.cside::after{content:""; position:absolute; z-index:2; left:0; top:0; width:3px; height:var(--cs-bh,0px); transform:translateY(var(--cs-by,0px)); border-radius:0 3px 3px 0; background:var(--fg); pointer-events:none}
.cside.ready::before,.cside.ready::after{transition:transform 600ms cubic-bezier(.3,.7,.2,1), height 600ms cubic-bezier(.3,.7,.2,1)}
.cside.cs-now::before,.cside.cs-now::after{transition:none}
.cside:not(.ready)::before,.cside:not(.ready)::after,.cside.cs-off::before,.cside.cs-off::after{opacity:0}
.cside.ready:not(.cs-off) button[aria-current="true"]{background:transparent}
.cside.ready:not(.cs-off) button[aria-current="true"]::before{display:none}
.cside .sk{height:14px; margin:15px 12px; border-radius:7px}
.cgrid-wrap{flex:1; min-width:0; overflow-y:auto; overscroll-behavior:contain; padding:12px 12px calc(24px + env(safe-area-inset-bottom,0px))}
.cgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px 8px}
.card{display:flex; flex-direction:column; align-items:center; gap:3px; padding:0 0 4px; border-radius:14px; text-align:center; min-width:0}
.card .ph{width:100%; aspect-ratio:1; border-radius:14px; background:var(--stage); display:grid; place-items:center; overflow:hidden; margin-bottom:5px; transition:transform var(--fast) var(--ease), box-shadow var(--fast)}
.card .ph img{width:84%; height:84%; object-fit:contain; display:block; transition:opacity 220ms var(--ease)}
/* ảnh charm chưa tải xong: ô ảnh là khung xương (nền xám + vệt sáng chạy), ảnh hiện mờ dần khi tải xong */
.card .ph.ld{background:var(--soft)}
.card .ph.ld img{opacity:0}
.card .ph.err img{display:none}
.card .ph.err::before{content:attr(data-fb); font-size:22px; font-weight:700; color:var(--muted)}
.card:active .ph{transform:scale(.96)}
@media (hover:hover){ .card:hover .ph{box-shadow:inset 0 0 0 1px var(--muted)} }
.card .nm{font-size:12.5px; font-weight:600; line-height:1.3; width:100%; padding:0 2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere}
.card .tag{font-size:12px; color:var(--muted); background:var(--soft); border-radius:6px; padding:1px 8px; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card .pr{font-size:12.5px; font-variant-numeric:tabular-nums; margin-top:auto; padding-top:1px}
.card .pr.free{color:var(--accent); font-weight:600}
.card .used{position:absolute; top:6px; right:6px; font-size:12px; font-weight:700; background:var(--fg); color:var(--bg); border-radius:999px; min-width:22px; height:22px; padding:0 6px; display:grid; place-items:center; line-height:1}
.card.on .ph{box-shadow:inset 0 0 0 2px var(--fg)}
.card.on .tag{background:var(--fg); color:var(--bg)}
/* vòng đã đủ 15 charm mà vẫn bấm thêm: ô ảnh vừa bấm nháy viền đỏ 2 lần rồi tắt */
.card.limit .ph{animation:limitFlash 1s linear}
@keyframes limitFlash{
  0%{box-shadow:inset 0 0 0 2px var(--danger)} 18%{box-shadow:inset 0 0 0 2px var(--danger)} 30%{box-shadow:inset 0 0 0 2px transparent}
  42%{box-shadow:inset 0 0 0 2px var(--danger)} 72%{box-shadow:inset 0 0 0 2px var(--danger)} 100%{box-shadow:inset 0 0 0 2px transparent}}
.card.skel{pointer-events:none}
.card.skel .ph{background:var(--soft)}
.card.skel .l1,.card.skel .l2{height:11px; border-radius:6px; margin-top:4px}
.card.skel .l1{width:72%} .card.skel .l2{width:44%}
.note{font-size:12.5px; color:var(--muted); padding:16px 4px 0; margin:0; text-align:center; text-wrap:balance}
.cgrid:empty + .note{padding-top:0}
.sk{background:var(--soft); position:relative; overflow:hidden}

/* sheets */
.overlay{position:fixed; inset:0; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center; z-index:50}
.sheet{background:var(--surface); width:100%; max-width:560px; border-radius:22px 22px 0 0; padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px)); max-height:90%; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:14px}
.sheet.tall{height:92%}
.sh-top{display:flex; flex-direction:column; gap:8px; touch-action:none; margin:0 -16px; padding:0 16px}
.grab{align-self:center; width:40px; height:5px; border-radius:3px; background:var(--line); flex:none}
.sh-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.sh-head h3{margin:6px 0 0; font-size:18px; font-weight:700; letter-spacing:-.01em; text-wrap:balance}
.code{font-size:12px; color:var(--muted); letter-spacing:.06em}
.x{width:40px; height:40px; border-radius:50%; background:var(--soft); display:grid; place-items:center; flex:none; transition:background-color var(--fast)}
.x::after{content:""; position:absolute; inset:-2px}
.x:active{background:var(--line)}
.lbl{font-size:12px; color:var(--muted)}
.lbl b{color:var(--fg); font-weight:600}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{display:inline-flex; align-items:center; gap:7px; height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--line); font-size:13.5px; font-weight:500; white-space:nowrap; transition:border-color var(--fast), box-shadow var(--fast), background-color var(--fast)}
.chip:active{background:var(--soft)}
.chip[aria-checked="true"]{border-color:var(--fg); box-shadow:inset 0 0 0 1px var(--fg); font-weight:700}
.sh-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; position:sticky; bottom:-18px; background:var(--surface); padding:10px 0 4px; margin-top:auto}
.btn{height:48px; padding:0 22px; border-radius:999px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--surface); transition:background-color var(--fast), opacity var(--fast)}
.btn:active{background:var(--soft)}
.btn.primary{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.btn.danger{background:var(--danger); color:var(--on-danger); border-color:var(--danger)}
.btn.primary:active,.btn.danger:active{opacity:.85}
.small{font-size:13px; color:var(--muted); margin:0; line-height:1.5}
.confirm-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:4px}

/* summary */
.sum-actions{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.sum-actions .primary{grid-column:1 / -1}
.sum-box{border:1px solid var(--line); border-radius:14px; overflow:hidden}
.row{display:grid; grid-template-columns:26px 40px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 12px; border-top:1px solid var(--line); width:100%; text-align:left}
.row:first-child{border-top:0}
.row.nonum{grid-template-columns:40px minmax(0,1fr) auto}
button.row{transition:background-color var(--fast)}
button.row:active{background:var(--soft)}
.row img{width:40px; height:40px; object-fit:contain}
.row .t{min-width:0}
.row .t b{display:block; font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .t span{font-size:12px; color:var(--muted)}
.row .p{font-variant-numeric:tabular-nums; font-size:13px}
.num{width:24px; height:24px; border-radius:50%; background:var(--fg); color:var(--bg); font-size:12px; font-weight:700; display:grid; place-items:center}
.total{display:flex; justify-content:space-between; align-items:baseline; padding:4px 2px}
.total span{font-weight:600}
.total b{font-size:22px; font-variant-numeric:tabular-nums}
.sec-t{font-size:12px; color:var(--muted); margin:2px 2px -6px; display:flex; justify-content:space-between}
details.open-code summary{cursor:pointer; color:var(--muted); font-size:13.5px; min-height:44px; display:flex; align-items:center; gap:6px}
details.open-code summary::-webkit-details-marker{display:none}
details.open-code summary::before{content:""; width:7px; height:7px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(-45deg); transition:transform var(--fast); margin:0 4px 0 2px}
details.open-code[open] summary::before{transform:rotate(45deg)}
.field-l{display:block; font-size:12.5px; font-weight:600; margin:2px 2px 6px}
.code-form{display:flex; gap:8px}
.code-form input{flex:1; min-width:0; height:48px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--fg); padding:0 12px; font:inherit; font-size:16px}
.code-form input[aria-invalid="true"]{border-color:var(--danger); box-shadow:inset 0 0 0 1px var(--danger)}
.err{color:var(--danger); font-size:12.5px; margin:6px 2px 0; font-weight:500}
.img-out{width:100%; border-radius:12px; border:1px solid var(--line); display:block}
.img-skel{width:100%; height:min(56vh,440px); border-radius:12px}
textarea.copybox{width:100%; min-height:240px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--fg); padding:12px; font:16px/1.5 var(--mono)}

.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); --toast-off:calc(100% + 28px + env(safe-area-inset-bottom,0px));
  transform:translate3d(-50%,var(--toast-off),0); opacity:0; visibility:hidden; will-change:transform,opacity;
  transition:transform 240ms var(--ease-in), opacity 180ms linear 60ms, visibility 0s linear 240ms; display:flex; align-items:center; gap:2px; min-height:44px; width:max-content; max-width:calc(100% - 32px); background:var(--fg); color:var(--bg); padding:0 16px; border-radius:22px; font-size:13.5px; font-weight:500; z-index:80; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.18)}
/* toast trượt lên từ đáy (giảm tốc khi tới), rút xuống nhanh hơn (tăng tốc khi đi); đang chạy vẫn đổi hướng mượt */
.toast.show{transform:translate3d(-50%,0,0); opacity:1; visibility:visible; transition:transform 420ms var(--ease-out), opacity 200ms linear, visibility 0s}
.toast .msg{padding:11px 0}
/* toast 2 dòng (vd. đạt giới hạn charm): canh giữa, dòng 2 là hướng dẫn, chữ nhẹ hơn */
.toast.two{border-radius:20px; text-align:center; justify-content:center}
.toast.two .msg{padding:10px 4px; line-height:1.4}
.toast .sub{display:block; font-weight:400; opacity:.78}
.toast.has-act{padding-right:4px}
.toast button{pointer-events:auto; flex:none; height:36px; padding:0 12px; margin-left:6px; border-radius:18px; font-weight:700; color:var(--toast-act)}
.toast button::after{content:""; position:absolute; inset:-4px}
.toast button:active{background:rgba(128,128,128,.25)}

/* điện thoại xoay ngang: vòng bên trái, danh mục bên phải */
/* :root:not(.kb) — webview Android thu nhỏ trang khi bàn phím bật: không nhảy sang bố cục ngang */
@media (orientation:landscape) and (max-height:520px){
  :root:not(.kb) .shell{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); column-gap:16px;
    padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
  :root:not(.kb) .top{grid-column:1 / -1; padding:6px 0}
  :root:not(.kb) .work{padding:0; grid-row:2; grid-column:1; align-self:start}
  :root:not(.kb) .catalog{grid-row:2; grid-column:2; border:1px solid var(--line); border-bottom:0; border-radius:18px 18px 0 0; min-height:0}
  :root:not(.kb) .toolbar{padding:6px 0 8px}
  :root:not(.kb) .toast{bottom:auto; top:calc(8px + env(safe-area-inset-top,0px)); --toast-off:calc(-100% - 16px - env(safe-area-inset-top,0px))}
}
@media (min-width:900px) and (min-height:521px){
  .shell{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); column-gap:28px; padding:0 24px 24px}
  .top{grid-column:1 / -1; padding:18px 0 10px}
  .work{padding:0; align-self:start}
  .canvas-wrap{justify-content:center}
  .catalog{border:1px solid var(--line); border-radius:20px; min-height:0}
  .overlay{align-items:center}
  .sheet{border-radius:22px; padding:22px; max-height:88%}
  .sheet.tall{height:auto}
  .grab{display:none}
  .sh-top{touch-action:auto}
  .cgrid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
  .cside{width:112px}
}
@media (prefers-reduced-motion:no-preference){
  .overlay:not([hidden]) .sheet{animation:up .24s var(--ease)}
  @keyframes up{from{transform:translateY(28px); opacity:.5} to{transform:none; opacity:1}}
  .cgrid.enter .card{animation:cardIn .26s var(--ease) both; animation-delay:calc(var(--i,0) * 22ms)}
  @keyframes cardIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
  .sel-pill:not([hidden]){animation:pillIn 340ms var(--ease-out)}
  .sel-pill.out{animation:pillOut 280ms var(--ease-in) forwards}
  .specs:not([hidden]){animation:popIn 600ms var(--ease-out)}
  .specs.out{animation:specsOut 280ms var(--ease-in) forwards; pointer-events:none}
  @keyframes specsOut{from{opacity:1; filter:blur(0)} to{opacity:0; filter:blur(8px); transform:scale(1.04)}}
  @keyframes popIn{from{opacity:0; transform:scale(.4)} to{opacity:1; transform:none}}
  @keyframes pillIn{from{transform:translate(-50%,100%)} to{transform:translate(-50%,0)}}
  @keyframes pillOut{from{opacity:1; filter:blur(0)} to{opacity:0; filter:blur(8px); transform:translateX(-50%) scale(1.04)}}
  .sk::after{content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg,transparent,var(--shine),transparent); animation:shimmer 1.3s infinite}
  @keyframes shimmer{to{transform:translateX(100%)}}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important}

  .card.limit .ph{animation:none; box-shadow:inset 0 0 0 2px var(--danger)}
}

/* Hạt chặn trên vòng: hạt xỏ vào dây nên mặt hạt vuông góc với dây, nhìn từ trên xuống chỉ thấy cạnh của hạt —
   một vạch bo tròn cắt ngang dây (rộng = bề dày hạt dọc theo dây, cao = đường kính). Màu lấy từ ảnh của hạt
   (vùng ngoài của hạt, bỏ lỗ / nhuỵ hoa ở giữa), đổ bóng như mặt cong của vòng để có khối. */

  try{
    const n=48,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d',{willReadFrequently:true});
    const k=Math.min(n/im.naturalWidth,n/im.naturalHeight),w=im.naturalWidth*k,h=im.naturalHeight*k;x.drawImage(im,(n-w)/2,(n-h)/2,w,h);

    for(let j=0;j<n;j++)for(let i=0;i<n;i++){const o=(j*n+i)*4;if(d[o+3]<200)continue;if(Math.hypot(i+.5-n/2,j+.5-n/2)<R*.58)continue;px.push([d[o],d[o+1],d[o+2],.299*d[o]+.587*d[o+1]+.114*d[o+2]]);}

/* Chặn hoa (hạt đan, có chỉ vàng): sheet có "Ảnh trên vòng" = ảnh thật của hạt nhìn nghiêng, thân dựng đứng
   (lỗ xỏ chạy trái–phải như khi nằm trên dây) → vẽ đúng ảnh đó để thấy chỉ vàng và vân đan.
   Chiều cao = Cao (mm), bề rộng dọc theo dây lấy theo tỉ lệ ảnh. Vòng chặn trơn không có ảnh này thì vẫn vẽ vạch màu. */

const TEX=new Map();

  if(!rec.cors)return null;

  return t;
}

function analyzeTex(im){
  const W=im.naturalWidth,H=im.naturalHeight;let x0=0,x1=W,y0=0,y1=H,avg=null;
  try{
    const k=Math.min(1,800/Math.max(W,1)),w=Math.max(1,Math.round(W*k)),h=Math.max(1,Math.round(H*k));
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);
    const d=x.getImageData(0,0,w,h).data,row=new Float32Array(h),col=new Float32Array(w);let r=0,g=0,b=0,n=0;
    for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++){const i=(yy*w+xx)*4,a=d[i+3];if(a>40){row[yy]++;col[xx]++;}if(a>200){r+=d[i];g+=d[i+1];b+=d[i+2];n++;}}
    let a0=-1,a1=-1;for(let yy=0;yy<h;yy++)if(row[yy]>=w*.3){if(a0<0)a0=yy;a1=yy;}
    if(a0>=0){y0=a0/k;y1=(a1+1)/k;}
    let c0=-1,c1=-1;const bh=Math.max(1,a1-a0+1);for(let xx=0;xx<w;xx++)if(col[xx]>=bh*.4){if(c0<0)c0=xx;c1=xx;}
    if(c0>=0){x0=c0/k;x1=(c1+1)/k;}
    if(n)avg='#'+[r/n,g/n,b/n].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('');
  }catch(e){}
  return{img:im,x0,y0,bw:Math.max(1,x1-x0),bh:Math.max(1,y1-y0),avg,strips:new Map()};
}
function texStrip(st,t,L){
  const T=st.thick||3,ppm=Math.max(4,Math.min(18,t.bh/T)),key=L+'|'+ppm.toFixed(3);

  S=document.createElement('canvas');S.width=w;S.height=h;const sx=S.getContext('2d');
  sx.drawImage(t.img,t.x0,t.y0,t.bw,t.bh,0,0,tw,h);
  if(tw<w&&tw>ov+1){
    /* các đoạn lặp chồng lên nhau một chút và mờ dần ở mép để không lộ đường nối */
    const f=document.createElement('canvas');f.width=Math.ceil(tw);f.height=h;const fx=f.getContext('2d');

    const codes=[];(parts[3]?parts[3].split('_').filter(Boolean):[]).forEach(c=>{const m=c.match(/^(.+)\*(\d{1,3})$/);if(m){for(let k=0;k<Math.min(200,+m[2]);k++)codes.push(m[1]);}else codes.push(c);});

/* ---------- hình sợi dây ----------
   Dây đan — vẽ theo ảnh mẫu vòng đỏ shop gửi 13/10 (vòng TRÒN đều, khoen vàng + 2 chốt viền vàng + đuôi bọc chỉ vàng):
   • đầu dây có chân quấn chỉ vàng + khoen chỉ vàng hình giọt nước nằm DỌC theo vòng (từ chân khoen lùi ngược chiều dây, uốn theo vòng);
   • lúc đeo dây chạy trọn một vòng tròn: từ chân khoen xuống trái, qua đáy, lên phải, qua đỉnh, luồn vào lỗ khoen từ phía đầu khoen,

/* toạ độ (mm, gốc ở u = 0) + góc tiếp tuyến của sợi dây ở trạng thái e (0 = đeo, 1 = trải thẳng) */

function geom(W,H,m,o){

     (lúc này chốt 1 đã nằm sát chốt 2 ở đầu đuôi). Trượt theo e nên lúc vòng đang duỗi ra charm tự chạy vào giữa; Tròn không đổi */

function setView(mode,instant,keepPref){

  syncSeg();

  const finish=()=>{VIEW.raf=0;if(VIEW.target===0)VIEW.pan=0;renderStage();updateHint();ensureSelVisible();};
  if(instant||reduceMotion()||VIEW.m===target){VIEW.m=target;finish();return;}
  const from=VIEW.m,dur=1300*Math.abs(target-from),t0=performance.now();

/* đổi Tròn → Ngang lúc đang chọn charm (12/10, shop yêu cầu): giữ charm đó trong khung khi dây trải ra.
   Charm đã nằm trong khung (khi cụm charm ở giữa) thì giữ cụm ở giữa; nằm ngoài thì trải sao cho charm ở giữa (không vượt quá 2 đầu dây) */
function selPan(){
  const base=clusterPan();
  if(sel==null||!LAY)return base;
  const x=LAY.list.find(en=>en.it.uid===sel);if(!x)return base;
  const g=LAY.g,u=x.u1-g.sh+g.shF,px=CW/2+(u-base)*g.sL,m=Math.max(48,g.sL*7);
  if(px>=m&&px<=CW-m)return base;
  return Math.max(g.panLo,Math.min(g.panHi,u));
}
/* Tròn → Ngang (13/10, shop yêu cầu): trải dây sao cho cụm charm (đã trượt vào giữa dây) nằm giữa khung.
   Chưa gắn charm thì nhìn vào giữa sợi dây */
function clusterPan(){
  if(!LAY)return 0;
  const g=LAY.g,c=g.u0-g.sh+g.shF+g.Wk/2;
  return Math.max(g.panLo,Math.min(g.panHi,c));

/* trượt dây khi đang trải ngang */

  VIEW.praf=requestAnimationFrame(step);
}
function fling(v){

    if(Math.abs(v)>.002&&Math.abs(VIEW.pan-want)<1e-6)VIEW.praf=requestAnimationFrame(step);else VIEW.praf=0;};
  VIEW.praf=requestAnimationFrame(step);
}
function ensureSelVisible(){

const canPanNow=()=>VIEW.target===1&&!VIEW.raf&&LAY&&LAY.g.panHi>LAY.g.panLo;
function hit(px,py){
  if(!LAY||VIEW.raf)return null;

  for(const pass of[0,1])for(let i=LAY.list.length-1;i>=0;i--){
    const x=LAY.list[i],e=x.e;if((e.kind==='dangle')!==(pass===1))continue;
    const ph=-x.rot,dx=px-x.x,dy=py-x.y;
    const lx=(dx*Math.cos(ph)-dy*Math.sin(ph))/LAY.s, ly=(dx*Math.sin(ph)+dy*Math.cos(ph))/LAY.s;
    const pad=Math.max(1.5,8/LAY.s-e.w/2);

}

});
cv.addEventListener('pointermove',e=>{

    panDrag.moved=true;
    const now=performance.now(),dt=Math.max(1,now-panDrag.lt),vNew=-(x-panDrag.lx)/LAY.s/dt;
    panDrag.v=panDrag.v*.5+vNew*.5;panDrag.lx=x;panDrag.lt=now;

  }

  if(canPanNow()){const edge=44;if(x<edge)VIEW.pan-=(edge-x)/edge*3;else if(x>CW-edge)VIEW.pan+=(x-(CW-edge))/edge*3;}

  const g=geom(CW,S,VIEW.m,{pan:VIEW.pan,lineMin:specsBottom+8,avoid:CORNER,lift:LIFT.v,nums:showNums});
  drag.u=uAt(g,x,y);

  if(to!==from){if(!drag.pushed){pushHist();drag.pushed=true;}const snapPos=posSnap();const[it]=state.items.splice(from,1);state.items.splice(to,0,it);startReflow(snapPos);}

function endDrag(){

/* bàn phím: ← → chọn charm, Shift + ← → đổi chỗ, Delete xoá, D nhân đôi, Esc bỏ chọn */

const thumbCache=new Map();
function charmThumb(code,px){
  const e=CE[code];if(!e)return'';
  if(e.img)return e.img;
  px=px||96;const key=code+'.'+px;if(thumbCache.has(key))return thumbCache.get(key);
  const D=2,c=document.createElement('canvas');c.width=c.height=px*D;const x=c.getContext('2d');x.scale(D,D);
  const k=px*.74/17.5;
  x.translate(px/2,px/2-(e.top+e.bottom)/2*k);
  x.strokeStyle='rgba(150,144,135,.35)';x.lineWidth=2.4*k;x.lineCap='round';x.beginPath();x.moveTo(-px*.42,0);x.lineTo(px*.42,0);x.stroke();
  x.scale(k,k);SH={c:'rgba(38,26,8,.22)',b:3*D,y:1.2*D};drawEntry(x,e);SH=null;
  const url=c.toDataURL();thumbCache.set(key,url);return url;
}
/* ảnh nhỏ của dây: vẽ sợi dây thành vòng tròn (dây ảnh thật cũng được uốn tròn như trên vòng) */
function strapThumb(code,px){

  px=px||96;const tex=strapTex(e),key='S'+code+'.'+px+(tex?'.t':'')+(strapTex2(e)?'2':'');
  if(thumbCache.has(key))return thumbCache.get(key);
  const D=2,c=document.createElement('canvas');c.width=c.height=px*D;const x=c.getContext('2d');x.scale(D,D);
  /* vòng lúc đeo (cỡ mặc định), có cả khoen + nút rút ở đỉnh vòng như trên khung vòng */
  const pm=pathModel(e,0),s=px*.66/(2*pm.R+pm.topExt),R=pm.R*s;
  SH={c:'rgba(38,26,8,.2)',b:2*D,y:1*D};drawStrapCurve(x,{pm,tab:pathTab(pm,0),L:pm.L,e:0,s,ax:px/2,ay:px/2+pm.topExt*s/2+R},e);SH=null;
  let url='';try{url=c.toDataURL();}catch(err){}
  thumbCache.set(key,url);return url;
}

   Ô nhập + tab bắt đầu chạy khi phần đẩy lên đã đi được ~85% (400ms). */
const RAISE_MS=700,S_DUR=380,S_AFTER_LIFT=400,DROP_AFTER=120;

function hl(text,toks){

  toks.forEach(t=>{let p=0;while((p=n.indexOf(t,p))>-1){for(let j=p;j<p+t.length;j++)on[map[j]]=true;p+=t.length;}});

function tool(t){
  const i=selIndex();
  /* Undo / Redo (13/10 thêm Redo): undo cất trạng thái hiện tại vào redoHist; thao tác mới (pushHist) xoá redoHist */
  if(t==='undo'||t==='redo'){
    const src=t==='undo'?hist:redoHist,dst=t==='undo'?redoHist:hist;
    if(!src.length)return;const from=posSnap();dst.push(snap());const s=JSON.parse(src.pop());
    state={strap:s.strap,size:s.size,items:s.items};fitState();sel=s.sel!=null&&state.items.some(x=>x.uid===s.sel)?s.sel:null;
    startReflow(from);changed();$('live').textContent=t==='undo'?'Đã undo':'Đã redo';return;
  }
  if(t==='clear'){if(state.items.length)openSheet('confirmClear');return;}
  if(i<0)return;
  if(t==='left'&&i>0)commit(()=>{const[it]=state.items.splice(i,1);state.items.splice(i-1,0,it);});
  if(t==='right'&&i<state.items.length-1)commit(()=>{const[it]=state.items.splice(i,1);state.items.splice(i+1,0,it);});
  if(t==='dup'){
    if(atLimit(CE[state.items[i].code])){limitHit(null);return;}
    if(!fitsRoom(CE[state.items[i].code])){fullHit(null);return;}
    commit(()=>{const it=state.items[i];const n={uid:newUid(),code:it.code};state.items.splice(i+1,0,n);sel=n.uid;});
  }
  if(t==='del'){
    const e=CE[state.items[i].code];
    commit(()=>{state.items.splice(i,1);const nx=state.items[Math.min(i,state.items.length-1)];sel=nx?nx.uid:null;});
    toast(e&&e.ring?'Đã xoá 1 khoen':`Đã xoá ${e?e.name+(e.vname?' · '+e.vname:''):'charm'}`,{undo:true});
  }
}

  if(DL){
    try{await DL.save({filename:name,data:blob});toast('Đã lưu ảnh');}
    catch(e){if(e&&e.code==='declined')return;toast('Không tải được ở đây. Nhấn giữ ảnh để lưu nhé.');}
    return;
  }
  try{
    const file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Thiết kế vòng PunPun'});return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}

/* ---------- toast (có nút Undo khi vừa xoá) ---------- */
let tt=null;
function toast(m,opt){
  opt=opt||{};
  const t=$('toast');
  t.innerHTML=`<span class="msg"></span>${opt.undo?'<button type="button" data-toast-undo>Undo</button>':''}`;
  const msg=t.querySelector('.msg');msg.textContent=m;
  /* dòng phụ (hướng dẫn): toast 2 dòng, canh giữa */
  if(opt.sub){const s=document.createElement('span');s.className='sub';s.textContent=opt.sub;msg.appendChild(s);}
  t.classList.toggle('two',!!opt.sub);
  t.classList.toggle('has-act',!!opt.undo);
  t.dataset.h=opt.undo?String(hist.length):'';
  /* đang hiện thì chỉ đổi nội dung; đang ẩn thì đợi 1 khung hình để trượt lên từ vị trí dưới đáy */
  if(!t.classList.contains('show'))requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
  $('live').textContent=m+(opt.sub?'. '+opt.sub:'')+(opt.undo?'. Bấm Undo để lấy lại.':'');
  clearTimeout(tt);tt=setTimeout(hideToast,opt.ms||(opt.undo?5000:2600));
}
function hideToast(){clearTimeout(tt);const t=$('toast');t.classList.remove('show');t.dataset.h='';}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-pick]');if(!b)return;
  const ds=b.dataset;
  if('close' in ds)return closeSheet();
  if('deselect' in ds){sel=null;refreshSel();return;}
  if('toastUndo' in ds){const t=$('toast');if(t.dataset.h!==''&&+t.dataset.h===hist.length)tool('undo');hideToast();return;}
  if(ds.pan){if(!LAY)return;const g=LAY.g,step=(CW*.6)/g.sL;panTo(Math.max(g.panLo,Math.min(g.panHi,VIEW.pan+(+ds.pan)*step)),340);return;}
  if(ds.view)return setView(ds.view);
  if(b.id==='infoBtn')return toggleInfo();
  if(ds.tool)return tool(ds.tool);
  if(ds.ctab){if(ds.ctab!==ctab){ctab=ds.ctab;renderCatalog(true);gridTop();}return;}
  if(ds.cat){const c=ds.cat==='all'?'all':(CAT.cats[+ds.cat]||'all');if(c!==catId){catId=c;renderCatalog(true);gridTop();}return;}
  if(ds.scat){const c=ds.scat==='all'?'all':(CAT.stopCats[+ds.scat]||'all');if(c!==stopCatId){stopCatId=c;renderCatalog(true);gridTop();}return;}
  if(ds.charm){
    const en=CE[ds.charm];if(!en)return;
    if(!fitsStrap(en,strapE())){toast(en.ring?'Khoen chỉ dùng cho vòng kiềng':'Vòng kiềng không dùng hạt chặn');return;}
    if(en.ring){addRingSet(en,b);return;}
    if(atLimit(en)){limitHit(b);return;}
    if(!fitsRoom(en)){fullHit(b);return;}
    const i=selIndex(),n={uid:newUid(),code:en.code};
    commit(()=>{if(i>=0)state.items.splice(i+1,0,n);else state.items.push(n);sel=null;});
    $('live').textContent=`Đã gắn ${en.name}${en.vname?' '+en.vname:''}, vị trí ${state.items.indexOf(n)+1}`;return;
  }
  if(ds.strap){
    const en=SE[ds.strap];if(!en||state.strap===en.code)return;
    /* dây ↔ kiềng: gỡ món không dùng được cho loại vòng mới (hạt chặn / khoen), có Undo */
    const drop=state.items.filter(it=>!fitsStrap(CE[it.code],en)),toB=isBangle(en);
    commit(()=>{state.strap=en.code;if(drop.length){state.items=state.items.filter(it=>!drop.includes(it));if(sel!=null&&!state.items.some(x=>x.uid===sel))sel=null;}});
    if(drop.length)toast(toB?`Đã gỡ ${drop.length} hạt chặn`:`Đã gỡ ${drop.length} khoen`,{sub:toB?'Vòng kiềng chỉ gắn charm + khoen':'Dây đan không thể dùng khoen',undo:true,ms:5000});
    else $('live').textContent=`Đã đổi sang ${en.name}${en.vname?' '+en.vname:''}`;
    return;
  }
  const a=ds.act;if(!a)return;
  if(a==='image'){if(!CAT.straps.length){toast('Đang tải danh mục, bạn đợi chút nhé');return;}return exportImage();}
  if(a==='download')return download();
  if(a==='link')return copyLink();
  if(a==='clearYes'){const n=state.items.length;closeSheet();commit(()=>{state.items=[];sel=null;});toast(`Đã xoá ${n} charm`,{undo:true});return;}
});
/* nút (i): bật / tắt bảng nhỏ Số charm · Đã dùng · Tạm tính; bấm ra ngoài hoặc Esc là đóng */
/* mở: phóng 0.4 → 1 (CSS popIn); đóng: mờ nhoè tan đi giống viên thông tin charm (CSS specsOut) xong mới gắn hidden */
const SPECS={out:false,t:0};
function toggleInfo(open){
  const sp=$('specs'),btn=$('infoBtn'),isOpen=btn.getAttribute('aria-expanded')==='true';open=open==null?!isOpen:open;
  btn.setAttribute('aria-expanded',String(open));
  if(open){if(SPECS.out){clearTimeout(SPECS.t);SPECS.out=false;sp.classList.remove('out');}sp.hidden=false;return;}
  if(sp.hidden||SPECS.out)return;
  if(reduceMotion()){sp.hidden=true;return;}
  SPECS.out=true;sp.classList.add('out');
  SPECS.t=setTimeout(()=>{SPECS.out=false;sp.classList.remove('out');sp.hidden=true;},290);
}
document.addEventListener('click',e=>{if(!$('specs').hidden&&e.target.closest&&!e.target.closest('#specs,#infoBtn'))toggleInfo(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('specs').hidden&&!sheetKind){toggleInfo(false);$('infoBtn').focus();}});
/* bấm bất kỳ đâu ngoài charm trên vòng (trừ các nút thao tác charm đang chọn) là bỏ chọn, hàng công cụ về Undo / Reset / Copy link.
   Nút Tròn/Ngang và nút ‹ › xem hai đầu dây (Ngang) không bỏ chọn (12/10, shop yêu cầu): đổi kiểu xem / trượt dây vẫn giữ charm đang chọn */
document.addEventListener('click',e=>{
  if(sel===null||!e.target||!e.target.closest)return;
  if(e.target===cv||e.target.closest('.tool[data-ctx="sel"],#viewSeg,.pan-btn,#numBtn,#infoBtn,#specs,#overlay,#toast'))return;
  sel=null;refreshSel();
});
$('numBtn').addEventListener('click',()=>{showNums=!showNums;$('numBtn').setAttribute('aria-pressed',String(showNums));renderStage();});
/* phím mũi tên cho nhóm Tròn/Ngang và tab Charm/Dây */
$('viewSeg').addEventListener('keydown',e=>{if(!/^Arrow/.test(e.key))return;const mode=VIEW.target===1?'circle':'line';setView(mode);document.querySelector(`[data-view="${mode}"]`).focus();e.preventDefault();});
$('ctabs').addEventListener('keydown',e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;const T=['charm','stop','strap'].concat($('tabBangle').hidden?[]:['bangle']),i=T.indexOf(ctab);ctab=T[(i+(e.key==='ArrowRight'?1:T.length-1))%T.length];renderCatalog(true);gridTop();document.querySelector(`[data-ctab="${ctab}"]`).focus();e.preventDefault();});
new ResizeObserver(()=>sizeStage()).observe($('canvasWrap'));
addEventListener('resize',sizeStage);
const themeChanged=()=>{TOK=null;renderStage();};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeChanged);}catch(e){}
new MutationObserver(themeChanged).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
addEventListener('hashchange',()=>{if(CAT.loading)return;const s=decode(location.hash.slice(1));if(s){commit(()=>{state={strap:s.strap,size:s.size,items:s.items};sel=null;});toast('Đã mở thiết kế được chia sẻ');}});

/* ---------- boot ---------- */
function initState(announce){
  const raw=location.hash&&location.hash.length>1?location.hash.slice(1):'';
  const fromHash=raw?decode(raw):null;
  const s=fromHash||loadDraft();
  state=s?{strap:s.strap,size:s.size,items:s.items}:defaultState();
  fitState();sel=null;
  if(announce&&fromHash)toast(fromHash.missing?`Đã mở thiết kế, ${fromHash.missing} charm không còn bán nên đã bỏ ra`:'Đã mở thiết kế được chia sẻ');
}
(async function boot(){
  let cached=null;
  if(STANDALONE){try{cached=JSON.parse(localStorage.getItem('punpun-sheet-v1')||'null');}catch(e){}}
  if(cached&&cached.cr)applyTables(cached.cr,cached.sr||[],cached.hr||[],cached.kr||[]);
  else if(STANDALONE){setCatalog([],[],'demo');CAT.loading=true;}
  else{const d=demoCatalog();setCatalog(d.charms,d.straps,'demo');}
  if(!CAT.loading)initState(true);else state={strap:'',size:STRAP_CM,items:[]};
  sizeStage();renderCatalog();changed();
  try{if(localStorage.getItem('punpun-view')==='line')setView('line',true);}catch(e){}
  if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('700 20px "Be Vietnam Pro"'),document.fonts.load('600 20px "Be Vietnam Pro"')]).then(()=>{thumbCache.clear();renderCatalog();renderStage();}).catch(()=>{});}
  if(!STANDALONE)return;
  const wasLoading=CAT.loading,pan0=VIEW.pan;
  /* mở link thiết kế lúc danh mục lưu trong máy còn cũ (chưa có món mới như vòng kiềng, khoen): tải xong sheet thì mở lại link cho đủ món (13/10) */
  const rawH=location.hash&&location.hash.length>1?location.hash.slice(1):'',dh=rawH&&!wasLoading?decode(rawH):null,
    hashGap=!!dh&&(dh.missing>0||decodeURIComponent(rawH).split('~')[1]!==dh.strap),h0=hist.length;
  try{
    const {cr,sr,hr,kr}=await loadSheet();
    try{localStorage.setItem('punpun-sheet-v1',JSON.stringify({cr,sr,hr,kr}));}catch(e){}
    const keep=wasLoading?null:{strap:state.strap,size:state.size,items:state.items};
    thumbCache.clear();applyTables(cr,sr,hr,kr);
    if(keep&&!(hashGap&&hist.length===h0)){state=keep;fitState();}else initState(true);
  }catch(err){
    if(wasLoading){const d=demoCatalog();setCatalog(d.charms,d.straps,'demo');initState(true);}
    console.warn('Không tải được Google Sheet',err);
  }
  sizeStage();renderCatalog();changed();
  if(VIEW.target===1&&!VIEW.raf&&!VIEW.praf&&!panDrag&&VIEW.pan===pan0){VIEW.pan=clusterPan();renderStage();}
})();
})();
